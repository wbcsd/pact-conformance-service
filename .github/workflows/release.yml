name: Release PACT CLI binaries

# Builds the standalone CLI binaries and attaches them to a GitHub release
# when a tag is pushed. Tag-driven: push a tag like `v1.0.0` (the tag is the
# version) and the release, its versioned assets, and the `latest` alias are
# created for you.
#
# The release itself is the version index: `releases/latest/download/<asset>`
# always resolves to the newest binary, and the releases API lists every
# version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build for Linux x86_64
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-linux
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: make build-linux
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pact_cli_x86_64
          path: pact_cli_x86_64
          if-no-files-found: error

  build-macos:
    name: Build for macOS arm64
    runs-on: macos-latest
    concurrency:
      group: ${{ github.workflow }}-mac
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - run: make build-mac
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pact_cli_arm64
          path: pact_cli_arm64
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      # Download every per-arch binary into one dir. Each artifact holds a
      # single pact_cli_<arch> file named to match what consumers download, so
      # merge-multiple lands them all side by side.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          merge-multiple: true
          path: dist
      # Asset names are kept stable so consumers can rely on
      # https://github.com/<owner>/<repo>/releases/latest/download/pact_cli_x86_64
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda
        with:
          files: dist/*
