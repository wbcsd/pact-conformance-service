name: Azure Blob Upload
on:
  push:
    branches:
      - ileap
      - blob
  workflow_dispatch:

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - id: version
        # CLI version comes from the test package's package.json — bump it to release.
        run: echo "version=$(jq -r .version packages/test/package.json)" >> "$GITHUB_OUTPUT"

  build-x86_64:
    name: Build for Linux x86_64
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-linux
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build pact_cli_x86_64
        run: make build-linux

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pact_cli_x86_64
          path: pact_cli_x86_64
          if-no-files-found: error

  build-mac:
    name: Build for macOS
    runs-on: macos-latest
    concurrency:
      group: ${{ github.workflow }}-mac
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build pact_cli_arm64
        run: make build-mac

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pact_cli_arm64
          path: pact_cli_arm64
          if-no-files-found: error

  upload:
    runs-on: ubuntu-latest
    needs: [meta, build-x86_64, build-mac]

    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      VERSION: ${{ needs.meta.outputs.version }}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pact_cli_x86_64
          path: target/release/x86_64

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pact_cli_arm64
          path: target/release/arm64

      - name: Upload versioned blobs
        run: |
          az storage blob upload --file target/release/x86_64/pact_cli_x86_64 --name "pact_cli_x86_64-$VERSION" -c act-bin --overwrite
          az storage blob upload --file target/release/arm64/pact_cli_arm64   --name "pact_cli_arm64-$VERSION"   -c act-bin --overwrite

      - name: Update unversioned "latest" aliases
        # Convenience for humans / existing download URLs; the index below is the
        # source of truth that conformance-test consumes.
        run: |
          az storage blob upload --file target/release/x86_64/pact_cli_x86_64 --name pact_cli_x86_64 -c act-bin --overwrite
          az storage blob upload --file target/release/arm64/pact_cli_arm64   --name pact_cli_arm64   -c act-bin --overwrite

      - name: Update version index (index.json)
        # Accumulate versions across releases: fetch the existing index (if any),
        # add/replace this version's entry, point "latest" at it, re-upload.
        run: |
          if [ "$(az storage blob exists -c act-bin --name index.json --query exists -o tsv)" = "true" ]; then
            az storage blob download -c act-bin --name index.json --file index.json --no-progress
          else
            echo '{"latest":null,"versions":{}}' > index.json
          fi
          jq --arg v "$VERSION" \
             --arg arm64 "pact_cli_arm64-$VERSION" \
             --arg x86_64 "pact_cli_x86_64-$VERSION" \
             '.versions[$v] = {arm64: $arm64, x86_64: $x86_64} | .latest = $v' \
             index.json > index.updated.json
          az storage blob upload --file index.updated.json --name index.json -c act-bin --overwrite --content-type application/json
