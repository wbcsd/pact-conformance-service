name: Azure Blob Upload
on:
  push:
    branches:
      - ileap
      - blob
  workflow_dispatch:

jobs:
  build-x86_64:
    name: Build for Linux x86_64
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-linux
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build pact_cli_x86_64
        run: |
          bun build --compile \
            --define 'process.env.NODE_ENV="production"' \
            --target=bun-linux-x86_64 \
            packages/test/src/cli.ts \
            --outfile pact_cli_x86_64

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pact_cli_x86_64
          path: pact_cli_x86_64
          if-no-files-found: error

  build-mac:
    name: Build for macOS
    runs-on: macos-latest
    concurrency:
      group: ${{ github.workflow }}-mac
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build pact_cli_arm64
        run: |
          bun build --compile \
            --define 'process.env.NODE_ENV="production"' \
            --target=bun-darwin-arm64 \
            packages/test/src/cli.ts \
            --outfile pact_cli_arm64

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pact_cli_arm64
          path: pact_cli_arm64
          if-no-files-found: error

  upload:
    runs-on: ubuntu-latest
    needs: [build-x86_64, build-mac]

    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pact_cli_x86_64
          path: target/release/x86_64

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pact_cli_arm64
          path: target/release/arm64

      - name: Upload blobs to storage
        run: |
          az storage blob upload --file target/release/x86_64/pact_cli_x86_64 --name pact_cli_x86_64 -c act-bin --overwrite
          az storage blob upload --file target/release/arm64/pact_cli_arm64 --name pact_cli_arm64 -c act-bin --overwrite
